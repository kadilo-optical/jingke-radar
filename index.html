document.addEventListener('click', async (e)=>{
  const t=e.target;

  // nav
  const navb=t.closest('.nav button');
  if(navb){ S.tab=navb.dataset.tab; closeSheet(); render(); return; }

  // filter
  const fb=t.closest('[data-f]');
  if(fb){ S.filter=fb.dataset.f; render(); return; }

  if(t.closest('#clr')){ S.q=''; render(); return; }

  // 提醒弹窗：知道了 / 稍后
  if(t.closest('#btnRemindOk')){ closeSheet(); return; }
  if(t.closest('#btnRemindLater')){
    // 10 分钟后再提醒：把当前已标记的"已提醒"临时撤回
    const set = remindedSet();
    const list = (S.leads||[]).filter(l=>l.next_follow_at);
    closeSheet();
    toast('10 分钟后再提醒你');
    setTimeout(()=>{
      const s2 = remindedSet();
      list.forEach(l=>{
        const k = `${l.id}|${l.next_follow_at}`;
        const t2 = parseFollowAt(l.next_follow_at);
        if(t2 && Date.now() - t2.getTime() < 3*86400000) s2.delete(k);
      });
      saveReminded(s2);
      checkReminders(false);
    }, 10*60*1000);
    return;
  }
  // 从提醒弹窗直接去某条的详情
  const ro = t.closest('[data-remind-open]');
  if(ro){
    const id = ro.dataset.remindOpen;
    const lead = S.leads.find(x=>String(x.id)===String(id));
    if(lead){ closeSheet(); setTimeout(()=>openDetail(lead), 250); }
    return;
  }

  // 已查看区 展开 / 收起（记住选择）
  if(t.closest('#btnToggleSeen')){
    const body=$('#seenBody'), arrow=t.closest('#btnToggleSeen')?.querySelector('span'),
          label=t.closest('#btnToggleSeen')?.querySelector('span:last-child');
    const collapsed = body && body.style.display === 'none';
    if(body) body.style.display = collapsed ? 'block' : 'none';
    if(arrow) arrow.style.transform = collapsed ? 'rotate(90deg)' : 'rotate(0deg)';
    if(label) label.textContent = collapsed ? '收起' : '展开';
    try{ localStorage.setItem(SEEN_FOLD_KEY, collapsed ? '0' : '1'); }catch(_){}
    return;
  }

  // 登录方式切换
  if(t.closest('#btnToOtp') || t.closest('#btnGoOtp')){ S.loginMode='otp'; render(); return; }
  if(t.closest('#btnToPwd')){ S.loginMode='pwd'; render(); return; }
  if(t.closest('#btnToReset')){
    S.loginMode='otp'; render();
    setTimeout(()=>toast('用验证码登录后，可在「我的」里重设密码', 2600), 120);
    return;
  }
  // 显示 / 隐藏密码
  if(t.closest('#btnEye')){
    const inp=$('#lgPwd'); if(!inp) return;
    const show = inp.type==='password';
    inp.type = show ? 'text' : 'password';
    t.closest('#btnEye').textContent = show ? '隐藏' : '显示';
    return;
  }

  // 密码登录
  if(t.closest('#btnLogin')){
    const phone=($('#lgPhone')?.value||'').trim();
    const pwd=($('#lgPwd')?.value||'');
    const err=$('#lgErr');
    if(err) err.textContent='';
    if(!/^1\d{10}$/.test(phone)){ if(err) err.textContent='请输入正确的 11 位手机号'; return; }
    if(!pwd){ if(err) err.textContent='请输入密码'; return; }
    const btn=t.closest('#btnLogin');
    const old=btn.textContent;
    btn.disabled=true; btn.textContent='登录中…';
    try{
      const r=await cloud.auth.signInWithPassword({phone, password:pwd});
      if(r.error){
        const msg = r.error.message||'';
        const code = r.error.code||'';
        const hint = (code==='password_not_set' || /password not set/i.test(msg))
          ? '这个号还没设过密码。点下面「去验证码登录」进来，之后在「我的」里设一个'
          : /incorrect|invalid_username/i.test(msg)
            ? '手机号或密码不对。忘了密码就点下面「去验证码登录」，验证手机号后可直接改密码'
            : msg;
        // 错误提示 + 一键转验证码登录，别让用户自己找入口
        const box = err ? (err.parentElement || err) : null;
        if(err) err.innerHTML = esc(hint) +
          ` <a href="javascript:void(0)" id="btnGoOtp" style="color:var(--brand-dk);text-decoration:underline;white-space:nowrap">去验证码登录</a>`;
        btn.disabled=false; btn.textContent=old;
        return;
      }
      S.session=r.data?.session||r.data||await cloud.auth.getSession();
      if(S.session && S.session.user===undefined && S.session.session) S.session=S.session.session;
      await afterLogin(phone);
    }catch(e){
      if(err) err.textContent=e.message||'登录失败';
      btn.disabled=false; btn.textContent=old;
    }
    return;
  }

  // login
  if(t.closest('#btnSendCode')){
    const phone=($('#lgPhone')?.value||'').trim();
    const err=$('#lgErr');
    if(!/^1\d{10}$/.test(phone)){ if(err) err.textContent='请输入正确的 11 位手机号'; return; }
    if(err) err.textContent='';
    const btn=t.closest('#btnSendCode');
    btn.disabled=true; btn.textContent='发送中…';
    try{
      const sent=await cloud.auth.sendOtp({phone});
      if(sent.error){ toast(sent.error.message||'发送失败'); btn.disabled=false; btn.textContent='获取验证码'; return; }
      PENDING_OTP = { phone, ...sent.data };
      toast('验证码已发送');
      let n=60; btn.textContent=`${n}s 后重发`;
      clearInterval(btn._t);
      btn._t=setInterval(()=>{
        n--;
        if(n<=0){ clearInterval(btn._t); btn.disabled=false; btn.textContent='重新获取'; }
        else btn.textContent=`${n}s 后重发`;
      },1000);
    }catch(e){
      toast('发送失败：'+(e.message||''));
      btn.disabled=false; btn.textContent='获取验证码';
    }
    return;
  }
  if(t.closest('#btnLoginOtp')){
    const phone=($('#lgPhone')?.value||'').trim();
    const code=($('#lgCode')?.value||'').trim();
    const err=$('#lgErr');
    if(!/^1\d{10}$/.test(phone)){ if(err) err.textContent='请输入正确的 11 位手机号'; return; }
    if(!PENDING_OTP || PENDING_OTP.phone!==phone){ if(err) err.textContent='请先获取验证码'; return; }
    if(!/^\d{4,6}$/.test(code)){ if(err) err.textContent='请输入收到的验证码'; return; }
    if(err) err.textContent='';
    const btn=t.closest('#btnLoginOtp');
    btn.disabled=true; btn.textContent='登录中…';
    const isNew = PENDING_OTP.isExistingUser === false;
    try{
      // password 传给 verifyOtp：新用户注册时一并写入初始密码；老用户忽略这个字段
      const r=await cloud.auth.verifyOtp({
        phone: PENDING_OTP.phone,
        verificationId: PENDING_OTP.verificationId,
        isExistingUser: PENDING_OTP.isExistingUser,
        token: code,
        password: DEFAULT_PWD,
      });
      if(r.error){
        if(err) err.textContent=r.error.message||'验证码错误';
        btn.disabled=false; btn.textContent='登录 / 注册';
        return;
      }
      PENDING_OTP=null;
      S.session=r.data?.session||r.data||await cloud.auth.getSession();
      if(S.session && S.session.user===undefined && S.session.session) S.session=S.session.session;
      S.loginMode='pwd';
      toast(isNew ? `账号已创建，初始密码 ${DEFAULT_PWD}` : '登录成功');
      // 老用户（验证码注册、从未设过密码）在这里补一个默认密码，下次可直接用密码登录
      if(!isNew) ensureDefaultPassword(phone);
      await afterLogin(phone);
    }catch(e){
      if(err) err.textContent=e.message||'登录失败';
      btn.disabled=false; btn.textContent='登录 / 注册';
    }
    return;
  }
  if(t.closest('#btnLogout')){
    // 主动退出：清掉 7 天免密记录，下次必须重新登录（这是用户明确的选择）
    clearAutoLogin();
    try{ localStorage.removeItem('radar_login_phone'); }catch(_){}
    await cloud.auth.signOut();
    S.session=null; S.leads=[]; S.followups=[]; SESSION_IS_ADMIN=null; render();
    toast('已退出登录，下次需重新登录');
    return;
  }

  // fab
  if(t.closest('#fab')){ S.editing=null; openSheet(leadForm({})); return; }

  // close
  if(t.closest('[data-close]')||t.id==='mask'){ closeSheet(); return; }

  // call
  const cb=t.closest('[data-call]');
  if(cb){ window.location.href='tel:'+cb.dataset.call; return; }

  // copy
  const cp=t.closest('[data-copy]');
  if(cp){
    const v=cp.dataset.copy;
    await copyText(v);
    return;
  }
  if(t.closest('[data-copyall]')){
    const pre=$('#scriptOut pre');
    if(pre) await copyText(pre.textContent, '话术已复制');
    return;
  }

  // 复制公司名
  const cn=t.closest('[data-cpname]');
  if(cn){
    const l=S.leads.find(x=>String(x.id)===cn.dataset.cpname);
    if(l) await copyText(l.company||l.shop_name||'', '公司名已复制');
    return;
  }

  // 复制公司完整信息
  const ci=t.closest('[data-cpinfo]');
  if(ci){
    const l=S.leads.find(x=>String(x.id)===ci.dataset.cpinfo);
    if(l) await copyText(leadInfoText(l), '公司信息已复制');
    return;
  }

  // platform chip in form
  const pf=t.closest('[data-pf]');
  if(pf){
    const inp=$('#f_platforms');
    const cur=inp.value.split('/').map(s=>s.trim()).filter(Boolean);
    const v=pf.dataset.pf;
    if(!cur.includes(v)) cur.push(v);
    inp.value=cur.join(' / ');
    return;
  }

  // edit
  const ed=t.closest('[data-edit]');
  if(ed){
    const l=S.leads.find(x=>String(x.id)===ed.dataset.edit);
    if(l){ S.editing=l; openSheet(leadForm(l)); }
    return;
  }

  // save
  if(t.closest('#btnSave')){
    const data=collectForm();
    if(!data) return;
    const pending = window.__pendingScore;
    if(pending && !S.editing){
      Object.assign(data, pending);
      if(pending.grade) data.grade = pending.grade;
    }
    const btn=t.closest('#btnSave');
    btn.disabled=true; btn.textContent='保存中…';
    try{
      const saved=await saveLead(data, S.editing?.id);
      window.__pendingScore=null;
      toast(S.editing?'已保存':'已转客户 ✓');
      await refresh();
      const fresh=S.leads.find(x=>String(x.id)===String(saved?.id)) || saved;
      S.editing=null;
      closeSheet();
      setTimeout(()=>{ if(fresh) openDetail(fresh); },280);
    }catch(err){
      console.error(err);
      toast('保存失败：'+(err.message||''));
      btn.disabled=false; btn.textContent=S.editing?'保存修改':'保存并转客户';
    }
    return;
  }

  // delete
  if(t.closest('#btnDel')){
    if(!S.editing) return;
    const target = S.editing;
    if(!confirm(`确定删除「${target.company}」？这条线索和它的跟进记录都会一起删掉，不能恢复。`)) return;
    try{
      await delLead(target.id);
      // 先从本地状态里摘掉，让看板/列表立刻减少；再拉一次云端校准（网络抖动也不影响已删除的事实）
      S.leads = S.leads.filter(x=>String(x.id)!==String(target.id));
      S.followups = S.followups.filter(x=>String(x.lead_id)!==String(target.id));
      S.editing=null; closeSheet(); render();
      toast('已删除');
      refresh();
    }catch(err){ toast('删除失败：'+(err.message||'')); }
    return;
  }

  // AI score
  if(t.closest('#btnAi')||t.closest('#btnAi2')){
    const lead = t.closest('#btnAi') ? (collectForm()||S.editing) : S.current;
    if(!lead) return;
    const btn=t.closest('button');
    const old=btn.textContent; btn.disabled=true; btn.textContent='打分中…';
    try{
      const r=await aiScore(lead);
      // 字段名为 tradeMode/category/scale；注意不能用 model 命名，会与"model_note"混淆导致解析错位
      const checks=[
        {n:'经营模式',s:r.tradeMode==='通过'?'pass':r.tradeMode==='不通过'?'fail':'unk',d:r.tradeModeNote||''},
        {n:'品类边界',s:r.category==='通过'?'pass':r.category==='不通过'?'fail':'unk',d:r.categoryNote||''},
        {n:'体量门槛',s:r.scale==='通过'?'pass':r.scale==='不通过'?'fail':'unk',d:r.scaleNote||''},
      ];
      const notes = `${r.verdict||''}｜切入角度：${r.hook||''}`;
      const payload={
        score: Number(r.score)||0,
        grade: r.grade||'C',
        score_notes: notes,
      };
      if(S.editing && S.editing.id){
        await saveLead(payload, S.editing.id);
        await refresh();
        const fresh=S.leads.find(x=>String(x.id)===String(S.editing.id));
        if(fresh) fresh.__checks = checks;
        S.editing=fresh;
        closeSheet();
        setTimeout(()=>{ if(fresh) openDetail(fresh); },260);
      }else{
        // 表单里的新线索：先回填等级，保存时一并带上评分
        $('#f_grade').value = r.grade||'C';
        window.__pendingScore = payload;
        toast(`AI 打分 ${r.score} 分 · ${r.grade} 级，点保存入库`);
      }
    }catch(err){
      console.error(err);
      toast('打分失败：'+(err.message||'请稍后再试'));
      btn.disabled=false; btn.textContent=old;
    }
    return;
  }

  // script generation
  const sb=t.closest('[data-script]');
  if(sb){
    const lead=curLead();
    if(!lead) return;
    const kind=sb.dataset.script;
    const out=$('#scriptOut');
    out.innerHTML='<div class="loading" style="padding:18px"><div class="spin"></div>正在结合这家公司信息生成…</div>';
    document.querySelectorAll('[data-script]').forEach(b=>b.disabled=true);
    try{
      let acc='';
      out.innerHTML='<pre></pre>';
      const pre=out.querySelector('pre');
      await llm(SYS_SCRIPT, buildScriptPrompt(lead,kind), d=>{ acc+=d; pre.textContent=acc; });
      out.innerHTML=`<pre>${esc(acc)}</pre><div class="copybtn" data-copyall>复制全部</div>`;
      await cloud.database.from('leads').update({script:acc}).eq('id',lead.id);
      lead.script=acc;
    }catch(err){
      console.error(err);
      out.innerHTML=`<p style="font-size:13px;color:var(--bad);margin:0">生成失败：${esc(err.message||'请稍后重试')}</p>`;
    }finally{
      document.querySelectorAll('[data-script]').forEach(b=>b.disabled=false);
    }
    return;
  }

  // add followup
  if(t.closest('#btnAddFu')){
    const lead=curLead(); if(!lead) return;
    const txt=($('#fuText')?.value||'').trim();
    if(!txt){ toast('写点内容再保存'); return; }
    const ch=$('#fuChannel')?.value;
    const nx=$('#fuNext')?.value||null;
    const btn=t.closest('#btnAddFu');
    btn.disabled=true; btn.textContent='保存中…';
    try{
      await addFollowup(lead.id, txt, ch, nx);
      toast('已记录');
      await refresh();
      const fresh=S.leads.find(x=>String(x.id)===String(lead.id));
      S.current=fresh;
      closeSheet();
      setTimeout(()=>{ if(fresh) openDetail(fresh); },260);
    }catch(err){
      toast('保存失败：'+(err.message||''));
      btn.disabled=false; btn.textContent='保存跟进 + 设下次提醒';
    }
    return;
  }

  // 转入我的客户
  if(t.closest('#btnCustomer')){
    const lead=curLead(); if(!lead) return;
    const btn=t.closest('#btnCustomer');
    btn.disabled=true; btn.textContent='转移中…';
    try{
      await cloud.database.from('leads')
        .update({
          is_customer:true,
          customer_at:new Date().toISOString(),
          updated_at:new Date().toISOString(),
          // 客户归属：转入操作者成为这个客户的负责人
          customer_owner_id: currentUid() || 'anonymous',
          customer_owner_name: ownerLabel({owner_name:displayName(), owner_phone:currentPhone()}),
        })
        .eq('id', lead.id);
      toast('已转入我的客户 ✓');
      await refresh();
      const fresh=S.leads.find(x=>String(x.id)===String(lead.id));
      S.current=fresh;
      closeSheet();
      setTimeout(()=>{ if(fresh) openDetail(fresh); },260);
    }catch(err){
      toast('转移失败：'+(err.message||''));
      btn.disabled=false; btn.textContent='转入我的客户 →';
    }
    return;
  }

  // 移出我的客户
  if(t.closest('#btnUncustomer')){
    const lead=curLead(); if(!lead) return;
    if(!confirm(`把「${lead.company||''}」移出我的客户？会回到线索库，跟进记录保留。`)) return;
    const btn=t.closest('#btnUncustomer');
    btn.disabled=true; btn.textContent='处理中…';
    try{
      await cloud.database.from('leads')
        .update({ is_customer:false, customer_at:null, customer_owner_id:null, customer_owner_name:null, updated_at:new Date().toISOString() })
        .eq('id', lead.id);
      toast('已移回线索库');
      await refresh();
      const fresh=S.leads.find(x=>String(x.id)===String(lead.id));
      S.current=fresh;
      closeSheet();
      setTimeout(()=>{ if(fresh) openDetail(fresh); },260);
    }catch(err){
      toast('操作失败：'+(err.message||''));
      btn.disabled=false; btn.textContent='移出我的客户（回到线索库）';
    }
    return;
  }

  // 修改登录密码
  if(t.closest('#btnEditPwd')){
    PWD_FLOW = { phone:'', verificationId:null, verificationToken:null, verified:false };
    openSheet(pwdForm());
    const inp=$('#pwPhone');
    if(inp) inp.value = (S.session?.user?.phone || '').replace(/^\+?86/,'').replace(/\D/g,'');
    return;
  }

  // 发送验证码（改密流程）
  if(t.closest('#btnPwSend')){
    const phone=($('#pwPhone')?.value||'').trim();
    const err=$('#pwErr');
    if(!/^1\d{10}$/.test(phone)){ if(err) err.textContent='请输入正确的 11 位手机号'; return; }
    if(err) err.textContent='';
    const btn=t.closest('#btnPwSend');
    btn.disabled=true; btn.textContent='发送中…';
    try{
      const sent=await cloud.auth.sendOtp({phone});
      if(sent.error){ if(err) err.textContent=sent.error.message||'发送失败'; btn.disabled=false; btn.textContent='获取验证码'; return; }
      PWD_FLOW.phone = phone;
      PWD_FLOW.verificationId = sent.data.verificationId;
      PWD_FLOW.isExistingUser = sent.data.isExistingUser;
      toast('验证码已发送');
      let n=60; btn.textContent=`${n}s 后重发`;
      clearInterval(btn._t);
      btn._t=setInterval(()=>{
        n--;
        if(n<=0){ clearInterval(btn._t); btn.disabled=false; btn.textContent='重新获取'; }
        else btn.textContent=`${n}s 后重发`;
      },1000);
    }catch(e){
      if(err) err.textContent=e.message||'发送失败';
      btn.disabled=false; btn.textContent='获取验证码';
    }
    return;
  }

  // 下一步：校验验证码，进第二步
  if(t.closest('#btnPwNext')){
    const code=($('#pwCode')?.value||'').trim();
    const err=$('#pwErr');
    if(!PWD_FLOW.verificationId){ if(err) err.textContent='请先获取验证码'; return; }
    if(!/^\d{4,6}$/.test(code)){ if(err) err.textContent='请输入收到的验证码'; return; }
    if(err) err.textContent='';
    const btn=t.closest('#btnPwNext');
    btn.disabled=true; btn.textContent='验证中…';
    try{
      // 只校验验证码，拿到一次性 verification_token（后续 /v1/reset 用它改密）
      const v=await cloud.auth.request('/v1/verification/verify', {
        method:'POST',
        body:{ verification_id: PWD_FLOW.verificationId, verification_code: code },
      });
      if(v.error){
        const m=v.error.message||'';
        if(err) err.textContent = /does not match|无效/i.test(m) ? '验证码不对，请重新输入' : (m||'验证失败');
        btn.disabled=false; btn.textContent='下一步：设置新密码';
        return;
      }
      const vt = (v.data && v.data.verification_token) || '';
      if(!vt){
        if(err) err.textContent='验证没拿到凭据，请重新获取验证码';
        btn.disabled=false; btn.textContent='下一步：设置新密码';
        return;
      }
      // 关键：验证码通过就等于证明了手机号归属，不再要求输入旧密码
      PWD_FLOW.verificationToken = vt;
      PWD_FLOW.verified = true;
      $('#pwdStep1').style.display='none';
      $('#pwdStep2').style.display='';
      const tip=$('#pwOkTip');
      if(tip) tip.textContent = `手机号 ${PWD_FLOW.phone} 已验证，直接设置新密码即可。`;
      setTimeout(()=>{ const i=$('#pwNew'); if(i) i.focus(); }, 120);
    }catch(e){
      if(err) err.textContent=e.message||'验证失败';
      btn.disabled=false; btn.textContent='下一步：设置新密码';
    }
    return;
  }

  // 保存新密码
  if(t.closest('#btnPwSave')){
    const p1=($('#pwNew')?.value||'').trim();
    const p2=($('#pwNew2')?.value||'').trim();
    const err=$('#pwErr2');
    if(p1.length<6){ if(err) err.textContent='密码至少 6 位'; return; }
    if(p1!==p2){ if(err) err.textContent='两次输入不一致'; return; }
    if(err) err.textContent='';
    const btn=t.closest('#btnPwSave');
    btn.disabled=true; btn.textContent='保存中…';
    try{
      if(!PWD_FLOW || !PWD_FLOW.verificationToken){
        if(err) err.textContent='请先完成手机号验证';
        btn.disabled=false; btn.textContent='保存新密码';
        return;
      }
      // 凭验证码换来的 verification_token 直接重置密码，无需旧密码
      const normPhone = (() => {
        const t = String(PWD_FLOW.phone||'').replace(/\D/g,'');
        const s = t.startsWith('0086') ? t.slice(4) : (t.startsWith('86') && t.length===13 ? t.slice(2) : t);
        return /^1\d{10}$/.test(s) ? '+86 ' + s : PWD_FLOW.phone;
      })();
      const r=await cloud.auth.request('/v1/reset', {
        method:'POST',
        body: {
          phone_number: normPhone,
          new_password: p1,
          verification_token: PWD_FLOW.verificationToken,
        },
      });
      if(r && r.error){
        const m = r.error.message||'';
        if(err) err.textContent = /token|jwt/i.test(m)
          ? '验证已过期，请关闭后重新点「修改登录密码」'
          : '修改失败：'+m;
        btn.disabled=false; btn.textContent='保存新密码';
        return;
      }
      toast('登录密码已更新');
      PWD_FLOW = null;
      closeSheet();
      // 立刻用新密码试一次登录：成功就直接进工作台，省得用户还要再输一遍
      try {
        const phone = (S.session?.user?.phone || '').replace(/^\+?86/, '').replace(/\D/g, '');
        if (phone) {
          const lg = await cloud.auth.signInWithPassword({ phone, password: p1 });
          if (!lg.error) {
            S.session = lg.data?.session || lg.data || await cloud.auth.getSession();
            await afterLogin(phone);
            toast('密码已更新，已自动登录', 2600);
            return;
          }
        }
      } catch (_) {}
      render();
      // 密码写进去了但登录没通过：如实提示，别让人以为改好了却登不进去
      setTimeout(()=>{
        toast('密码已保存。若密码登录仍提示错误，请用「验证码登录」进入后重设一次', 4200);
      }, 600);
    }catch(e){
      if(err) err.textContent='修改失败：'+(e.message||'');
      btn.disabled=false; btn.textContent='保存新密码';
    }
    return;
  }

  // 修改用户名
  if(t.closest('#btnEditName')){
    openSheet(nameForm());
    return;
  }
  if(t.closest('#itCheckUpdate')){
    onVerClick();
    return;
  }
  if(t.closest('#btnSaveName')){
    const v=($('#f_name')?.value||'').trim();
    if(!v){ toast('名称不能为空'); return; }
    try{
      localStorage.setItem('radar_display_name', v);
      if(S.session && S.session.user) S.session.user.name = v;
      toast('已保存');
      closeSheet(); render();
    }catch(_){ toast('保存失败'); }
    return;
  }

  // 打开地址检索报告
  if(t.closest('#btnAddrSearch')){
    S.searchAddr = '';
    S.searchResult = null;
    S.searchPicked = {};
    openSheet(addrSearchView());
    return;
  }

  // 向外扩展检索范围（相邻片区 → 全义乌 → 各片区）
  if(t.closest('#btnExpandSearch')){
    expandSearch();
    return;
  }

  // 开始检索 → 真实联网抓取 → 出报告
  if(t.closest('#btnDoAddr')){
    const addr = ($('#f_addr')?.value||'').trim();
    if(!addr){ toast('请先填地址'); return; }
    doAddrSearch(addr);
    return;
  }

  // 勾选 / 取消勾选
  const pickEl = t.closest('[data-pick]');
  if(pickEl && pickEl.type === 'checkbox'){
    const i = pickEl.dataset.pick;
    S.searchPicked[i] = pickEl.checked;
    // 只刷新按钮上的数量，避免整页重绘把滚动位置弄丢
    const btn = document.querySelector('#btnConfirmImport');
    const cnt = Object.keys(S.searchPicked).filter(k=>S.searchPicked[k]).length;
    if(btn){ btn.disabled = !cnt; btn.textContent = `确认入库（${cnt} 家）`; }
    return;
  }

  // 网络被拦截时：一键重新检索当前片区
  if(t.closest('#btnRetrySearch')){
    const area = S.searchResult?.area || S.searchAddr || '';
    if(!area){ toast('请先回到上一步填写地址'); return; }
    doAddrSearch(area);
    return;
  }

  // 全选 / 全不选
  if(t.closest('#btnPickAll')){
    const list = S.searchResult?.results || [];
    const cnt = Object.keys(S.searchPicked).filter(k=>S.searchPicked[k]).length;
    const allOn = list.length>0 && cnt===list.length;
    const next = {};
    if(!allOn) list.forEach((x,i)=>{ next[i]=true; });
    S.searchPicked = next;
    openSheet(addrSearchView());
    return;
  }

  // 确认入库
  if(t.closest('#btnConfirmImport')){
    const list = S.searchResult?.results || [];
    const picked = list.filter((x,i)=>S.searchPicked[i]);
    if(!picked.length){ toast('先勾选要入库的公司'); return; }
    const btn = t.closest('#btnConfirmImport');
    btn.disabled = true; btn.textContent = '正在入库…';
    try{
      // 用规范化名称比对，防止「义乌市XX」和「义乌XX」被当成两家重复入库
      const exist = new Set((S.leads||[]).map(l=>normCompanyName(l.company)));
      let ok = 0, skip = 0, fail = 0;
      for(const x of picked){
        const nk = normCompanyName(x.name);
        if(exist.has(nk)){ skip++; continue; }
        try{
          await saveLead({
            company: x.name,
            shop_name: '',
            boss_name: '',
            phone: (x.phones&&x.phones[0]) || '',
            platforms: (x.platforms||[]).join(' / '),
            revenue_evidence: (x.scales||[]).join('；'),
            demand_signal: (x.reasons||[]).slice(0,2).join('；'),
            area: x.address || S.searchAddr || '',
            note: `按地址检索收录｜检索片区：${S.searchResult.area}｜检索依据：${(x.reasons||[]).join('；')}｜网页证据：${(x.evidence||'无').slice(0,160)}`,
            grade: x.level==='A' ? 'A' : x.level==='B' ? 'B' : 'C',
            score: x.level==='A' ? 85 : x.level==='B' ? 65 : 45,
            status: '待跟进',
            is_customer: false,
          });
          ok++;
        }catch(_){ fail++; }
      }
      await refresh();
      closeSheet();
      let msg = `已入库 ${ok} 家`;
      if(skip) msg += `，跳过重复 ${skip} 家`;
      if(fail) msg += `，失败 ${fail} 家`;
      // 入库后把剩下的结果标一遍重复，用户接着往下扩时不会又看到这批
      markDuplicates(S.searchResult);
      toast(msg, 3000);
      S.tab = 'leads';
      S.searchResult = null;
      S.searchPicked = {};
      render();
    }catch(e){
      toast('入库失败：'+(e.message||''));
      btn.disabled = false; btn.textContent = '确认入库';
    }
    return;
  }
});

/* ---------- 版本检测：让装了 APK 的人知道线上有新版本 ----------
   APK 里的网页是打包进去的，改完线上网页不会自动进到 App 里，
   所以必须由 App 主动去线上问「现在最新是几版」，比自己新就提示升级。

   实测结论（2026-10，之前认为「App 内不可能联网比对」是错的）：
   1) 云端接口对 Origin: https://localhost 明确放行——
      Access-Control-Allow-Origin: https://localhost，正好是 App 的 origin；
   2) 但 version.json 是纯静态文件，不带任何 CORS 头，网页 fetch 拿不到；
   3) Android 侧的 CapacitorHttp 原生请求不受同源策略约束。
   因此双通道取版本：先查云端 app_version 表（最可靠），
   再退回 CapacitorHttp 抓 version.json；两者都失败才静默放弃。 */
const APP_VERSION = '1.4.5';
const SHARECODE = (function(){
  try{
    const u = new URL(location.href);
    return u.searchParams.get('sharecode') || '';
  }catch(_){ return ''; }
})();
const PUBLISHED_ORIGIN = 'https://glasses-radar.app.workbuddy.host';
const FALLBACK_SHARECODE = 'ABA2SVUO5X';   // 发布链接里的固定分享码
const APK_URL = 'https://github.com/kadilo-optical/jingke-radar/releases/latest/download/jingke-radar.apk';

/* 原生 HTTP：App 内用 CapacitorHttp（不受同源策略限制），网页版用普通 fetch */
function nativeHttpGet(url, timeoutMs){
  const cap = (typeof window !== 'undefined') && window.Capacitor
    && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorHttp;
  if (cap && cap.get) {
    return cap.get({ url, connectTimeout: timeoutMs || 8000, readTimeout: timeoutMs || 8000 })
      .then(r => (typeof r.data === 'string' ? r.data : JSON.stringify(r.data)));
  }
  return fetch(url, { cache: 'no-store' }).then(r => r.text());
}

/* 从启动地址里读 ?v=（调试入口：可以手动指定一个更高版本号来验提示条） */
function versionFromLaunchUrl(){
  try{
    const u = new URL(location.href);
    const v = u.searchParams.get('v') || u.searchParams.get('version');
    if(v && /^\d+(\.\d+)*$/.test(v)) return v;
    const m = String(u.hash||'').match(/[?#&]v=(\d+(?:\.\d+)*)/);
    return m ? m[1] : null;
  }catch(_){ return null; }
}

/* 通道 1：云端 app_version 表 —— id 固定为 1 的单行，所有客户端都读得到 */
async function versionFromCloud(){
  const { data, error } = await cloud.database
    .from('app_version')
    .select('version,note,apk_url,released_at')
    .eq('id', 1);
  if (error || !data || !data.length) return null;
  const row = data[0];
  if (!row || !row.version) return null;
  return {
    version: String(row.version),
    note: row.note || '',
    apkUrl: row.apk_url || APK_URL,
    releasedAt: row.released_at || '',
  };
}

/* 通道 2：静态 version.json（发布目录里那份），再用启动地址的 ?v= 兜底 */
async function versionFromStaticFile(){
  try{
    const txt = await nativeHttpGet(PUBLISHED_ORIGIN + '/version.json?sharecode=' + FALLBACK_SHARECODE, 8000);
    const obj = JSON.parse(txt);
    if (obj && obj.version) {
      return { version: String(obj.version), note: obj.note || '', apkUrl: obj.apkUrl || APK_URL };
    }
  }catch(_){}
  const v = versionFromLaunchUrl();
  if (v) return { version: v, note: '', apkUrl: APK_URL };
  return null;
}

async function fetchVersionJson(){
  let r = null;
  try { r = await versionFromCloud(); } catch(_){}
  if (!r) { try { r = await versionFromStaticFile(); } catch(_){} }
  return r;
}

let UPDATE_CHECKED = false;
async function checkAppUpdate(force){
  if(window.APP_ENV !== 'native' && !force) return;   // 只在 App 壳内自动检查
  if(UPDATE_CHECKED && !force) return;
  UPDATE_CHECKED = true;
  try{
    const remote = await fetchVersionJson();
    if(!remote) return;
    if(cmpVersion(remote.version, APP_VERSION) <= 0){
      syncVerBadge();
      if(force) toast('已是最新版本 v' + APP_VERSION);
      return;
    }
    syncVerBadge(remote);
    showUpdateBar(remote);
  }catch(_){ /* 网络不好就静默跳过，不打扰用户 */ }
}

/* 顶部版本号角标：显示本机安装的版本；
   一旦查到线上有更新，变成高亮样式（白底 + 呼吸光）提示点它 */
function syncVerBadge(remote){
  const el = document.getElementById('verNum');
  if(el) el.textContent = APP_VERSION;
  const btn = document.getElementById('btnVer');
  if(!btn) return;
  if(remote && cmpVersion(remote.version, APP_VERSION) > 0){
    btn.classList.add('new');
    btn.title = '发现新版本 v' + remote.version + '，点击升级';
  }else{
    btn.classList.remove('new');
    btn.title = '当前版本 v' + APP_VERSION + '，点击检查更新';
  }
}

/* 点顶部版本号：有更新就直接弹升级条，没有就提示已是最新 */
async function onVerClick(){
  const btn = document.getElementById('btnVer');
  if(btn && btn.classList.contains('new')){
    // 已知有更新：直接给出升级条，不再等网络
    try{
      const remote = await fetchVersionJson();
      if(remote && cmpVersion(remote.version, APP_VERSION) > 0){ showUpdateBar(remote, true); return; }
    }catch(_){}
  }
  if(btn) btn.textContent = '检查中…';
  try{
    const remote = await fetchVersionJson();
    if(remote && cmpVersion(remote.version, APP_VERSION) > 0){
      syncVerBadge(remote);
      showUpdateBar(remote, true);
    }else if(remote){
      toast('已是最新版本 v' + APP_VERSION);
      syncVerBadge();
    }else{
      // 取不到线上版本（弱网/被墙）：不要谎称最新，如实说明
      toast('暂时连不上更新服务器，请检查网络后重试');
    }
  }catch(e){
    toast('检查更新失败：' + (e.message || '网络异常'));
  }finally{
    const b = document.getElementById('btnVer');
    if(b) b.textContent = 'v' + APP_VERSION;
  }
}

function cmpVersion(a, b){
  const pa = String(a).split('.').map(n=>parseInt(n,10)||0);
  const pb = String(b).split('.').map(n=>parseInt(n,10)||0);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const x = pa[i]||0, y = pb[i]||0;
    if(x!==y) return x-y;
  }
  return 0;
}

  const old = document.querySelector('#updateBar');

    + 'box-shadow:0 8px 28px rgba(0,0,0,.28);font-size:14px;line-height:1.45';
  el.innerHTML = '<div style="flex:1">'
    + '<div style="font-weight:600;margin-bottom:2px">发现新版本 v' + esc(String(remote.version)) + '</div>'
    + '<div style="color:#C9C2BB;font-size:12.5px">' + esc(remote.note || '修复问题、优化体验') + '</div>'
    + '</div>'
    + '<button id="updateGo" style="background:#C4562A;color:#fff;border:none;padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:600;white-space:nowrap">立即更新</button>'
    + '<button id="updateLater" style="background:transparent;color:#9A9188;border:none;padding:8px 4px;font-size:13px">稍后</button>';

    else { window.open(url, '_blank'); }
  };
}

/* ============================================================
   到点提醒：每分钟检查一次「下次跟进」，到点弹窗 + 响铃
   ------------------------------------------------------------
   · 只提醒还没提醒过的（按 id+时间 组合去重）
   · 网页后台标签页会被浏览器降频，所以每 20 秒检查，并且页面重新可见时补一次检查
   · 铃声用 Web Audio 现场合成，不依赖音频文件，离线 APK 也能响
   ============================================================ */
const REMINDED_KEY = 'radar_reminded';
let REMIND_TIMER = null;

function remindedSet(){
  try{ return new Set(JSON.parse(localStorage.getItem(REMINDED_KEY)||'[]')); }catch(_){ return new Set(); }
}
function saveReminded(set){
  try{ localStorage.setItem(REMINDED_KEY, JSON.stringify(Array.from(set).slice(-1500))); }catch(_){}
}

/* 三声"叮咚"，用振荡器合成，避免携带音频文件 */
function playChime(times=2){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!playChime._ctx) playChime._ctx = new AC();
    const ctx = playChime._ctx;
    if(ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    for(let i=0;i<times;i++){
      [880, 1174.7].forEach((freq, k)=>{
        const t0 = now + i*0.62 + k*0.18;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.22, t0+0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t0+0.42);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t0); osc.stop(t0+0.45);
      });
    }
  }catch(e){ console.warn('提示音播放失败（需先与页面交互一次）', e); }
}

function remindPopup(list){

    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)">
      <span style="width:6px;height:6px;border-radius:50%;background:var(--brand);flex:0 0 auto"></span>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.company||l.shop_name||'未命名')}</div>
        <div style="font-size:12px;color:var(--ink3);margin-top:2px">
          ${esc(fmtDateTime(l.next_follow_at))}${l.phone?` · ${esc(l.phone)}`:''}
        </div>
      </div>
      <button class="mini" data-remind-open="${l.id}" style="flex:0 0 auto">去跟进</button>
    </div>`).join('');

  const html = `
  <div class="sheet-h">
    <h2>⏰ 该跟进了</h2>
    <button class="close" data-close>✕</button>
  </div>
  <div class="sheet-b">
    <div style="background:var(--brand-lt);border-radius:12px;padding:12px 14px;margin-bottom:6px;font-size:13px;color:var(--brand-dk)">
      有 ${list.length} 条线索到了约定的跟进时间
    </div>
    ${items}
    <div style="height:14px"></div>
    <button class="btn" id="btnRemindLater">稍后再提醒（10 分钟）</button>
    <button class="btn ghost" id="btnRemindOk" style="margin-top:8px">知道了</button>
  </div>`;
  openSheet(html);
  playChime(2);
  if(navigator.vibrate) try{ navigator.vibrate([120,80,120]); }catch(_){}
}

function dueLeads(){
  const now = Date.now();
  const done = remindedSet();
  return S.leads.filter(l=>{
    if(!l.next_follow_at) return false;
    const t = parseFollowAt(l.next_follow_at);
    if(!t) return false;
    // 到点即提醒；超过 3 天的不再打扰
    if(t.getTime() > now) return false;
    if(now - t.getTime() > 3*86400000) return false;
    return !done.has(`${l.id}|${l.next_follow_at}`);
  });
}

function checkReminders(force){
  if(!S.session) return;
  if(S.leads.length===0) return;
  const list = dueLeads();
  if(list.length===0) return;
  // 正在编辑/已打开弹窗时不打断
  const sheetOn = $('#sheet') && $('#sheet').classList.contains('on');
  if(sheetOn && !force) return;
  const set = remindedSet();
  list.forEach(l=>set.add(`${l.id}|${l.next_follow_at}`));
  saveReminded(set);
  remindPopup(list);
}

function startReminders(){
  if(REMIND_TIMER) clearInterval(REMIND_TIMER);
  REMIND_TIMER = setInterval(()=>checkReminders(false), 20000);
  setTimeout(()=>checkReminders(false), 3000);
}

(function boot(){
  // 首屏渲染绝不允许把整页搞白：出错就回退到登录页/错误提示
  try{ render(); }
  catch(e){
    console.error('首屏渲染失败', e);
    const app=$('#app');
    if(app) app.innerHTML = `<div class="loading" style="flex-direction:column;gap:12px;padding:40px 20px;text-align:center">
      <div style="font-size:14px;color:var(--ink2)">启动出错了</div>
      <div style="font-size:12px;color:var(--ink3)">${esc(String(e && e.message || e))}</div>
      <button class="btn" style="width:auto;padding:10px 20px" onclick="location.reload()">重新加载</button>
    </div>`;
  }
  // 顶部版本号：写死的是本机安装的版本，保证任何情况下都能看到
  syncVerBadge();
  (async ()=>{
    try{
      // OAuth 回调分发（WorkBuddy 账号登录）——必须在任何路由守卫之前
      const url = new URL(location.href);
      if(url.searchParams.has('code') || url.searchParams.has('error')){
        const provider = url.searchParams.get('provider');
        if(provider==='workbuddy' && typeof cloud.auth.handleWorkBuddyCallback==='function'){
          const r = await cloud.auth.handleWorkBuddyCallback();
          if(!r?.error && r?.data){
            for(const k of ['code','state','provider']) url.searchParams.delete(k);
            history.replaceState(null,'',`${url.pathname}${url.search}${url.hash}`);
          }else if(r?.error){
            toast(r.error.message||'登录失败');
          }
        }
      }
      await bootSession();
    }catch(err){
      console.error(err);
      toast('连接云端失败，请检查网络');
      render();
    }
    // 预热模型
    try{ await ensureModel(); }catch(_){}
    // 检查更新（非阻塞）
    checkAppUpdate();
    startReminders();
  })();
})();

// 从后台切回前台时刷新
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && S.session) refresh();
});
</script>
</body>
</html>
