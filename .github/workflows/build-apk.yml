name: Build Android APK

# 触发方式：
#  1) 在 GitHub 网页 Actions 页面手动点 Run workflow
#  2) 推送到 main 分支自动构建
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # GitHub ubuntu runner 已预装 Android SDK（ANDROID_HOME 已设），无需再装。
      # 只需预先接受许可协议，gradle 才能自动补齐缺的组件。

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 同步网页资源到 www
        run: npm run sync:www

      - name: 生成 Android 工程
        run: npx cap add android

      - name: Capacitor sync
        run: npx cap sync android

      - name: 确认应用名（由 capacitor.config.json 的 appName 写入）
        run: cat android/app/src/main/res/values/strings.xml

      - name: 构建 Debug APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: jingke-radar-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
